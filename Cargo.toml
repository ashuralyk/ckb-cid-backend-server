[workspace]
resolver = "2"
members = [
    "crates/cid-backend-core",
    "crates/cid-backend-daemon",
    "tests",
]

[workspace.dependencies]
ckb-types = "0.119"
log = "0.4"
tracing = "0.1"
cid-process-executor = { git = "https://github.com/ashuralyk/ckb-common-intention-dispatcher", rev = "0e1272b11c6be2e3e08a3fb5f614a5f2751f180a" }
