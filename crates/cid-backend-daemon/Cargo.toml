[package]
name = "cid-backend-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
cid-backend-core = { path = "../cid-backend-core" }
ckb-types = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
hex = "0.4"

[dev-dependencies]
cid-backend-core = { path = "../cid-backend-core" }
cid-process-executor = { workspace = true }
cid-protocol = { workspace = true }
ckb-types = { workspace = true }
ckb-hash = "0.119"
secp256k1 = { version = "0.29", features = ["global-context", "recovery"] }
serde_json = "1"
hex = "0.4"
