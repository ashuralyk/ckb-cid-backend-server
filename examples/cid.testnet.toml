# CKB testnet CID digest daemon config (read-only example).
#
# Values fetched read-only from https://testnet.ckb.dev/rpc (get_live_cell /
# get_block_hash). Outpoints change after Type-ID upgrades; the daemon
# rediscovers CID lock code cells each tick from type_id_args — do not pin
# CellDeps here.
#
# Process enablement is NOT in this file. After Lucas deploys Process state /
# code Type IDs, register them via the HTTP API:
#   PUT/POST /v1/processes
#   {
#     "identity_type_id_args": "0x<PROCESS_STATE_TYPE_ID_ARGS>",
#     "identity_type_id": "0x<PROCESS_STATE_TYPE_ID_HASH>",
#     "code_type_id_args": "0x<PROCESS_CODE_TYPE_ID_ARGS>",
#     "code_type_id": "0x<PROCESS_CODE_TYPE_ID_HASH>"
#   }
# DELETE /v1/processes/0x<identity_type_hash> disables. Registry persists under
# [registry].path across restarts.
#
# Placeholders below — Lucas fills live Type IDs after deploy. Do not invent.
# Keyless: no .env, no private keys, no signing, no chain writes.

[network]
name = "ckb-testnet"
genesis_hash = "0x10639e0895502b5688a6be8cf69460d76541bfa4821629d86d62ba0aae3f9606"
validate_genesis = true

[rpc]
url = "https://testnet.ckb.dev/rpc"
# indexer_url omitted — same endpoint serves indexer get_cells

[cid_lock]
# Live CID lock CODE cell Type ID (placeholders until redeploy):
type_id_args = "0x<CID_LOCK_TYPE_ID_ARGS_32>"
type_id = "0x<CID_LOCK_TYPE_ID_FULL_HASH_32>"

[registry]
path = "data/process-registry.json"
max_entries = 64

[loop]
poll_interval_secs = 5
confirmation_depth = 24

[observe]
# health_bind = "127.0.0.1:9100"
api_bind = "127.0.0.1:9101"
log_format = "json"
